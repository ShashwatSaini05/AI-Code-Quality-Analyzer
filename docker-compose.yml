# ============================================================
# CodeSage AI — Docker Compose
# Full development stack: Frontend, Backend, PostgreSQL, Redis, Qdrant
# ============================================================

services:
  # ── Backend API ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codesage-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://codesage:codesage_pass@postgres:5432/codesage_db
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./ml/models:/app/ml/models
    networks:
      - codesage-net
    restart: unless-stopped

  # ── Frontend ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codesage-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - codesage-net
    restart: unless-stopped

  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: codesage-postgres
    environment:
      POSTGRES_USER: codesage
      POSTGRES_PASSWORD: codesage_pass
      POSTGRES_DB: codesage_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codesage -d codesage_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codesage-net
    restart: unless-stopped

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: codesage-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - codesage-net
    restart: unless-stopped

  # ── Qdrant (Vector Database) ───────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: codesage-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - codesage-net
    restart: unless-stopped

  # ── Nginx Reverse Proxy ────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: codesage-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - codesage-net
    restart: unless-stopped

# ── Volumes ──────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  qdrant_data:

# ── Networks ─────────────────────────────────────────────────
networks:
  codesage-net:
    driver: bridge
